name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go-server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: go-server

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go-server/go.sum

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Postgres and the Go server
        run: |
          docker compose up -d --build --wait postgres go-server
          for _ in $(seq 1 30); do
            curl -sf localhost:8080/tenants > /dev/null && exit 0
            sleep 1
          done
          echo "Go server did not become ready" >&2
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # run_tests.py always exits 0, so count its passes against the number of test objects.
      - name: Provided tests
        run: |
          python tests/run_tests.py | tee provided.log
          passed=$(grep -c '✅' provided.log || true)
          total=$(ls tests/objects/*.json | wc -l)
          echo "$passed/$total provided tests passed"
          test "$passed" -eq "$total"

      - name: Edge-case tests
        run: python tests/run_extra_tests.py

      - name: Server logs
        if: failure()
        run: docker compose logs

  vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: govulncheck (reachable Go vulnerabilities)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          work-dir: go-server

      - name: Grype (repository dependencies)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          only-fixed: true
          severity-cutoff: high
          output-format: table

      - name: Build the Go server image
        run: docker build -t cloudstore-go:ci go-server

      - name: Grype (Go server image)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: cloudstore-go:ci
          only-fixed: true
          severity-cutoff: high
          output-format: table

  # Advisory only: the report never fails the pipeline.
